[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-mcp"
version = "1.0.0"
description = "MCP-native agent orchestration platform with discovery, planning, policy enforcement, execution, and traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=2,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.8"]

[project.scripts]
orion = "orion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
